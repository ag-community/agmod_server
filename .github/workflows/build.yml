name: Build

# Controls when the action will run. Triggers the workflow on push, pull request or manual events
on:
  push:
  pull_request:
  workflow_dispatch:

  # Run GitHub Actions monthly to make sure CI isn't broken
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: "Build on ${{ matrix.os.suffix }}"

    strategy:
      matrix:
        os:
          - runs-on: windows-2025
            suffix: ci-windows
            plat: windows
            arch: x86
          - runs-on: ubuntu-26.04
            suffix: ci-linux
            plat: linux
            arch: i386
        target: [server]

    # The type of runner that the job will run on
    runs-on: ${{ matrix.os.runs-on }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for automatic versioning
          persist-credentials: false

      - name: Setup Nix
        if: matrix.os.plat == 'linux'
        uses: nixbuild/nix-quick-install-action@v35

      - name: Cache Nix
        if: matrix.os.plat == 'linux'
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}

      - name: Setup xmake
        if: matrix.os.plat == 'windows'
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1.2.5
        with:
          xmake-version: "3.1.2"

      - name: Build (Linux, Nix)
        if: matrix.os.plat == 'linux'
        shell: bash
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            xmake f -y -p linux -a i386 -m releasedbg -c
            xmake -y
            xmake amxx-offsets
            xmake hamdata
            xmake install -o "${{ github.workspace }}/_build/ci-install"
          '

      - name: Configure (Windows)
        if: matrix.os.plat == 'windows'
        run: xmake f -y -p ${{ matrix.os.plat }} -a ${{ matrix.os.arch }} -m releasedbg -c

      - name: Build (Windows)
        if: matrix.os.plat == 'windows'
        run: xmake -y

      - name: Generate AMXX offsets (Windows)
        if: matrix.os.plat == 'windows'
        run: xmake amxx-offsets

      - name: Install (Windows)
        if: matrix.os.plat == 'windows'
        run: xmake install -o ${{ github.workspace }}/_build/ci-install

      # Prepare and Upload Artifact
      - name: Prepare and Upload Artifact
        id: prepare_artifact
        run: >
          python scripts/package_target.py
          --build-dir ${{ github.workspace }}/build
          --install-dir ${{ github.workspace }}/_build/ci-install
          --artifact-dir ${{ github.workspace }}/_build/ci-artifact
          --target ${{ matrix.target }}
          --suffix ${{ matrix.os.suffix }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: ${{github.workspace}}/_build/ci-artifact/${{ steps.prepare_artifact.outputs.artifact_name }}

  package:
    name: "Package Release"
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Copy hamdata.ini to Windows artifact
        run: |
          mkdir -p artifacts/AG-server-ci-windows/ag_addon/addons/amxmodx/configs
          cp artifacts/AG-server-ci-linux/ag_addon/addons/amxmodx/configs/hamdata.ini artifacts/AG-server-ci-windows/ag_addon/addons/amxmodx/configs/hamdata.ini

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AG-server-ci-windows
          path: artifacts/AG-server-ci-windows
          overwrite: true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AG-server-ci-linux
          path: artifacts/AG-server-ci-linux
          overwrite: true
