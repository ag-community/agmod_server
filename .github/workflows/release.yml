name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build on ${{ matrix.os.suffix }}"

    strategy:
      matrix:
        os:
          - runs-on: windows-2025
            suffix: windows
            plat: windows
            arch: x86
          - runs-on: ubuntu-26.04
            suffix: linux
            plat: linux
            arch: i386
        target: [server]

    runs-on: ${{ matrix.os.runs-on }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Required for automatic versioning

      - name: Install Ubuntu packages
        if: matrix.plat == 'linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update || true
          sudo apt install -y libc6:i386 linux-libc-dev:i386 gcc-multilib g++-multilib make unzip

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: "3.1.2"

      - name: Set up rust
        if: matrix.plat == 'linux'
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Configure
        run: xmake f -y -p ${{ matrix.plat }} -a ${{ matrix.arch }} -m releasedbg -c

      - name: Build
        run: xmake -y

      - name: Generate AMXX offsets
        run: xmake amxx-offsets

      - name: Generate hamdata.ini
        if: matrix.plat == 'linux'
        run: xmake hamdata

      # Install
      - name: Install
        run: xmake install -o ${{ github.workspace }}/_build/ci-install

      # Prepare and Upload Artifact
      - name: Prepare and Upload Artifact
        id: prepare_artifact
        run: >
          python scripts/package_target.py
          --build-dir ${{ github.workspace }}/build
          --install-dir ${{ github.workspace }}/_build/ci-install
          --artifact-dir ${{ github.workspace }}/_build/ci-artifact
          --target ${{ matrix.target }}
          --suffix ${{ matrix.os.suffix }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: ${{github.workspace}}/_build/ci-artifact/${{ steps.prepare_artifact.outputs.artifact_name }}

  release:
    name: "Publish GitHub Release"
    needs: build
    runs-on: ubuntu-26.04

    steps:
      # Checks-out the exact commit that was built and tagged
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Required for release notes generation

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Copy hamdata.ini to Windows artifact
        run: |
          mkdir -p artifacts/AG-server-windows/ag_addon/addons/amxmodx/configs
          cp artifacts/AG-server-linux/ag_addon/addons/amxmodx/configs/hamdata.ini artifacts/AG-server-windows/ag_addon/addons/amxmodx/configs/hamdata.ini

      - name: Resolve release tag
        id: resolve_tag
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create ZIP archives
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_build/release-assets"
          cd "$GITHUB_WORKSPACE/artifacts/AG-server-linux"
          zip -r "$GITHUB_WORKSPACE/_build/release-assets/ag-server-linux-${{ steps.resolve_tag.outputs.sha }}.zip" ag_addon
          cd "$GITHUB_WORKSPACE/artifacts/AG-server-windows"
          zip -r "$GITHUB_WORKSPACE/_build/release-assets/ag-server-windows-${{ steps.resolve_tag.outputs.sha }}.zip" ag_addon

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.resolve_tag.outputs.tag }}" \
            "$GITHUB_WORKSPACE"/_build/release-assets/*.zip \
            --generate-notes \
            --title "AG server ${{ steps.resolve_tag.outputs.sha }}"
